<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { 
      height: 100%; width: 100%; margin: 0; padding: 0; 
      background: #2c3e50; font-family: sans-serif; 
      overflow: hidden; 
    }

    #room {
      position: relative; width: 100%; height: 100%; 
      background: linear-gradient(to bottom, #34495e 50%, #2c3e50 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    .floor {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
      background: repeating-linear-gradient(45deg, #8b5a2b, #8b5a2b 30px, #a67c5d 30px, #a67c5d 60px);
    }

    #character {
      position: absolute; width: 80px; height: 80px;
      background: linear-gradient(45deg, #ff4d4d, #00aaff);
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid white; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: left 2s ease-in-out, top 2s ease-in-out;
      z-index: 100;
    }

    #chat-container {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      height: 140px; background: rgba(0, 0, 0, 0.9);
      border: 3px solid #ffd700; border-radius: 12px;
      padding: 10px; overflow-y: auto; color: #ffd700;
      z-index: 9999;
    }

    #messages { display: flex; flex-direction: column-reverse; }
  </style>
</head>
<body>

  <div id="room">
    <div class="floor"></div>
    <div id="character">POMNI</div>
  </div>

  <div id="chat-container">
    <div id="messages"></div>
  </div>

  <script>
    const character = {
      el: document.getElementById('character'),
      name: "POMNI",
      color: "#ff4d4d",
      lines: [
        "Is there an exit...?",
        "I just want to go home.",
        "This place feels wrong...",
        "What should I do now?"
      ]
    };

    function log(message) {
      const msgs = document.getElementById('messages');
      const line = document.createElement('div');
      line.innerHTML = `<span style="color:\( {character.color}; font-weight:bold;">[ \){character.name}]</span>: ${message}`;
      msgs.prepend(line);
      if (msgs.children.length > 8) msgs.lastElementChild.remove();
    }

    // Character wanders around the room
    function wander() {
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight * 0.6;

      const newX = 50 + Math.random() * (maxX - 100);
      const newY = 100 + Math.random() * (maxY - 150);

      character.el.style.left = newX + 'px';
      character.el.style.top = newY + 'px';

      // Random dialogue
      if (Math.random() > 0.6) {
        log(character.lines[Math.floor(Math.random() * character.lines.length)]);
      }

      setTimeout(wander, 3000 + Math.random() * 4000);
    }

    // Click on character to interact
    character.el.addEventListener('click', () => {
      const replies = ["...Hello?", "You can see me?", "I'm scared...", "Will you help me?"];
      log(replies[Math.floor(Math.random() * replies.length)]);
    });

    // Start everything
    window.onload = () => {
      character.el.style.left = '40%';
      character.el.style.top = '50%';
      wander();
      log("Pomni appears in the room...");
    };
  </script>
</body>
</html>
