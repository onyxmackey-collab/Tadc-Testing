<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { 
      height: 100%; width: 100%; margin: 0; padding: 0; 
      background: #2c3e50; font-family: sans-serif; 
      overflow: hidden; 
      touch-action: none; /* Better touch support */
    }

    #room {
      position: relative; width: 100%; height: 100%; 
      background: linear-gradient(to bottom, #34495e 50%, #2c3e50 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    .floor {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
      background: repeating-linear-gradient(45deg, #8b5a2b, #8b5a2b 30px, #a67c5d 30px, #a67c5d 60px);
    }

    #character {
      position: absolute; width: 80px; height: 80px;
      background: linear-gradient(45deg, #ff4d4d, #00aaff);
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid white; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: transform 0.1s ease-out;
      z-index: 100;
      user-select: none;
      cursor: pointer;
    }

    .heart {
      position: absolute;
      font-size: 30px;
      color: #ff69b4;
      pointer-events: none;
      animation: floatUp 1.5s forwards;
      z-index: 200;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-120px); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="room">
    <div class="floor"></div>
    <div id="character">❤️</div>
  </div>

  <script>
    const character = document.getElementById('character');
    let isFollowing = false;

    // Make character follow mouse / finger
    function moveCharacter(x, y) {
      const rect = character.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      // Gentle following with some lag
      const targetX = x - rect.width / 2;
      const targetY = y - rect.height / 2;

      character.style.left = targetX + 'px';
      character.style.top = targetY + 'px';
    }

    // Pet reaction (click or tap)
    function petReaction(e) {
      const rect = character.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      // Create floating heart
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤️';
      heart.style.left = (x - 15) + 'px';
      heart.style.top = (y - 30) + 'px';
      document.body.appendChild(heart);

      // Remove after animation
      setTimeout(() => heart.remove(), 1600);

      // Happy bounce animation
      character.style.transform = 'scale(1.3)';
      setTimeout(() => character.style.transform = 'scale(1)', 200);
    }

    // Mouse support
    document.addEventListener('mousemove', (e) => {
      if (isFollowing) moveCharacter(e.clientX, e.clientY);
    });

    // Touch support (mobile)
    document.addEventListener('touchmove', (e) => {
      if (isFollowing && e.touches.length > 0) {
        const touch = e.touches[0];
        moveCharacter(touch.clientX, touch.clientY);
      }
    });

    // Start following when mouse is pressed down
    document.addEventListener('mousedown', () => isFollowing = true);
    document.addEventListener('mouseup', () => isFollowing = false);

    // Touch start/end
    document.addEventListener('touchstart', () => isFollowing = true);
    document.addEventListener('touchend', () => isFollowing = false);

    // Click/tap to pet
    character.addEventListener('click', petReaction);
    character.addEventListener('touchend', (e) => {
      // Only pet if not dragging too much
      petReaction(e);
    });

    // Initial position
    window.onload = () => {
      character.style.left = (window.innerWidth / 2 - 40) + 'px';
      character.style.top = (window.innerHeight / 2 - 40) + 'px';
    };
  </script>
</body>
</html>
