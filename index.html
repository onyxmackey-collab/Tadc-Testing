<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { 
      height: 100%; width: 100%; margin: 0; padding: 0; 
      background: #2c3e50; font-family: sans-serif; 
      overflow: hidden; 
      touch-action: none;
    }

    #room {
      position: relative; width: 100%; height: calc(100% - 80px); 
      background: linear-gradient(to bottom, #34495e 50%, #2c3e50 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    .floor {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
      background: repeating-linear-gradient(45deg, #8b5a2b, #8b5a2b 30px, #a67c5d 30px, #a67c5d 60px);
    }

    #character {
      position: absolute; width: 80px; height: 80px;
      background: linear-gradient(45deg, #ff4d4d, #00aaff);
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid white; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: left 2s ease-in-out, top 2s ease-in-out, transform 0.2s;
      z-index: 100;
      user-select: none;
      cursor: pointer;
    }

    #chat-container {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 80px; background: rgba(0, 0, 0, 0.9);
      border-top: 3px solid #ffd700; padding: 10px;
      display: flex; align-items: center; gap: 10px;
      z-index: 9999;
    }

    #message-input {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      background: #333; color: white; font-size: 16px;
    }

    #send-btn {
      padding: 12px 20px; background: #ffd700; color: #000;
      border: none; border-radius: 8px; font-weight: bold;
      cursor: pointer;
    }

    #messages {
      position: fixed; bottom: 90px; left: 15px; right: 15px;
      height: 160px; background: rgba(0,0,0,0.75);
      border: 2px solid #ffd700; border-radius: 8px;
      padding: 10px; overflow-y: auto; color: #ffd700;
      font-size: 14px; z-index: 9998;
    }

    #api-key-input {
      position: fixed; top: 10px; left: 10px; z-index: 10000;
      background: rgba(0,0,0,0.8); padding: 8px; border-radius: 6px;
      color: white; display: none;
    }
  </style>
</head>
<body>

  <div id="room">
    <div class="floor"></div>
    <div id="character">🌹</div>
  </div>

  <div id="messages"></div>

  <div id="chat-container">
    <input type="text" id="message-input" placeholder="Talk to the character...">
    <button id="send-btn">Send</button>
  </div>

  <div id="api-key-input">
    OpenAI Key: <input type="password" id="key-input" placeholder="sk-..." size="40">
    <button onclick="saveKey()">Save</button>
  </div>

  <script>
    const character = document.getElementById('character');
    let isFollowing = false;
    let wanderTimeout = null;
    let apiKey = '';

    // Wandering behavior
    function wander() {
      if (isFollowing) return;
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight * 0.55;
      const newX = 50 + Math.random() * (maxX - 100);
      const newY = 100 + Math.random() * (maxY - 150);
      character.style.left = newX + 'px';
      character.style.top = newY + 'px';
      wanderTimeout = setTimeout(wander, 2500 + Math.random() * 3500);
    }

    function moveCharacter(x, y) {
      const targetX = x - 40;
      const targetY = y - 40;
      character.style.transition = 'left 0.1s linear, top 0.1s linear';
      character.style.left = targetX + 'px';
      character.style.top = targetY + 'px';
    }

    function addMessage(text, isUser = false) {
      const messagesDiv = document.getElementById('messages');
      const msg = document.createElement('div');
      msg.style.margin = '5px 0';
      msg.innerHTML = isUser 
        ? `<strong>You:</strong> ${text}` 
        : `<strong>Pomni:</strong> ${text}`;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !apiKey) return;

      addMessage(text, true);
      input.value = '';

      addMessage("thinking...");

      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: "You are Pomni, a scared but kind girl trapped in a strange digital circus world. Respond naturally, emotionally, and in character. Keep replies short." },
              { role: "user", content: text }
            ],
            max_tokens: 150
          })
        });

        const data = await res.json();
        const reply = data.choices[0].message.content;
        
        // Remove "thinking..."
        document.getElementById('messages').lastChild.remove();
        addMessage(reply);
      } catch (e) {
        document.getElementById('messages').lastChild.remove();
        addMessage("...I can't connect right now.");
      }
    }

    // Mouse / Touch following
    document.addEventListener('mousemove', (e) => { if (isFollowing) moveCharacter(e.clientX, e.clientY); });
    document.addEventListener('touchmove', (e) => { 
      if (isFollowing && e.touches.length > 0) moveCharacter(e.touches[0].clientX, e.touches[0].clientY); 
    });

    document.addEventListener('mousedown', () => { isFollowing = true; clearTimeout(wanderTimeout); });
    document.addEventListener('mouseup', () => { isFollowing = false; wander(); });
    document.addEventListener('touchstart', () => { isFollowing = true; clearTimeout(wanderTimeout); });
    document.addEventListener('touchend', () => { isFollowing = false; wander(); });

    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('message-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function saveKey() {
      apiKey = document.getElementById('key-input').value.trim();
      if (apiKey) {
        document.getElementById('api-key-input').style.display = 'none';
        addMessage("Connected! Talk to me...");
      }
    }

    // Start
    window.onload = () => {
      character.style.left = (window.innerWidth / 2 - 40) + 'px';
      character.style.top = (window.innerHeight / 2 - 40) + 'px';
      wander();
      document.getElementById('api-key-input').style.display = 'block';
    };
  </script>
</body>
</html>
