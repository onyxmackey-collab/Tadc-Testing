<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { 
      height: 100%; width: 100%; margin: 0; padding: 0; 
      background: #2c3e50; font-family: sans-serif; 
      overflow: hidden; 
      touch-action: none;
    }

    #room {
      position: relative; width: 100%; height: 100%; 
      background: linear-gradient(to bottom, #34495e 50%, #2c3e50 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
    }

    .floor {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
      background: repeating-linear-gradient(45deg, #8b5a2b, #8b5a2b 30px, #a67c5d 30px, #a67c5d 60px);
    }

    #character {
      position: absolute; width: 80px; height: 80px;
      background: linear-gradient(45deg, #ff4d4d, #00aaff);
      color: white; font-weight: bold; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid white; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: left 2s ease-in-out, top 2s ease-in-out, transform 0.2s;
      z-index: 100;
      user-select: none;
      cursor: pointer;
    }

    .heart {
      position: absolute;
      font-size: 36px;
      color: #ff69b4;
      pointer-events: none;
      animation: floatUp 1.8s forwards;
      z-index: 200;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-140px); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="room">
    <div class="floor"></div>
    <div id="character">❤️</div>
  </div>

  <script>
    const character = document.getElementById('character');
    let isFollowing = false;
    let wanderTimeout = null;

    // Wandering behavior
    function wander() {
      if (isFollowing) return; // Don't wander while being followed

      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight * 0.6;

      const newX = 50 + Math.random() * (maxX - 100);
      const newY = 100 + Math.random() * (maxY - 150);

      character.style.left = newX + 'px';
      character.style.top = newY + 'px';

      wanderTimeout = setTimeout(wander, 2500 + Math.random() * 3500);
    }

    // Follow finger/mouse
    function moveCharacter(x, y) {
      const targetX = x - 40;
      const targetY = y - 40;
      character.style.transition = 'left 0.1s linear, top 0.1s linear';
      character.style.left = targetX + 'px';
      character.style.top = targetY + 'px';
    }

    // Pet reaction (only on tap/click)
    function petReaction(e) {
      const rect = character.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;

      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤️';
      heart.style.left = (x - 18) + 'px';
      heart.style.top = (y - 40) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 2000);

      // Happy bounce
      character.style.transform = 'scale(1.35)';
      setTimeout(() => character.style.transform = 'scale(1)', 250);
    }

    // Mouse support
    document.addEventListener('mousemove', (e) => {
      if (isFollowing) moveCharacter(e.clientX, e.clientY);
    });

    // Touch support
    document.addEventListener('touchmove', (e) => {
      if (isFollowing && e.touches.length > 0) {
        const touch = e.touches[0];
        moveCharacter(touch.clientX, touch.clientY);
      }
    });

    // Start / stop following
    document.addEventListener('mousedown', () => { isFollowing = true; clearTimeout(wanderTimeout); });
    document.addEventListener('mouseup', () => { isFollowing = false; wander(); });

    document.addEventListener('touchstart', () => { isFollowing = true; clearTimeout(wanderTimeout); });
    document.addEventListener('touchend', () => { isFollowing = false; wander(); });

    // Click/tap to pet
    character.addEventListener('click', petReaction);
    character.addEventListener('touchend', petReaction);

    // Start
    window.onload = () => {
      character.style.left = (window.innerWidth / 2 - 40) + 'px';
      character.style.top = (window.innerHeight / 2 - 40) + 'px';
      wander();
    };
  </script>
</body>
</html>
